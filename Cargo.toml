[workspace]

[package]
name = "silero-v5-candle-rs"
version = "0.1.0"
edition = "2024"
description = "Silero v5 TTS in Rust (candle): v5_ru, v5_cis_ext and v5_cis_base_nostress"
license = "CC-BY-NC-SA-4.0"
readme = "README.md"
publish = false

[lib]
name = "silero_v5_candle"
path = "src/lib.rs"

[[bin]]
name = "silero"
path = "src/bin/silero.rs"

[dependencies]
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
realfft = "3.5"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
