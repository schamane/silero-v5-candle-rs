[workspace]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
# Robustheit: kein stiller Panic, kein blinder Clone, jede Unterdrückung begründet.
unwrap_used = "warn"
redundant_clone = "warn"
clone_on_ref_ptr = "warn"
missing_assert_message = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
dbg_macro = "warn"
todo = "warn"
panic_in_result_fn = "warn"

[package]
name = "silero-v5-candle-rs"
version = "0.2.0"
edition = "2024"
# Let-Chains (`if let ... && ...`) und Edition 2024 verlangen 1.88.
rust-version = "1.88"
description = "Silero v5 TTS in Rust (candle): v5_ru, v5_cis_ext and v5_cis_base_nostress"
license = "CC-BY-NC-SA-4.0"
readme = "README.md"
publish = false

[features]
default = ["metal"]
# Apple-GPU-Backend. Ohne dieses Feature (oder ohne Metal-Gerät) rechnet alles auf der CPU.
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
# Optionale BLAS-Backends für die CPU (Apple Accelerate bzw. Intel MKL); nicht Standard.
# Opt-in und nicht durch die Python-Goldens abgedeckt (BLAS-Rundung weicht ab).
accelerate = ["candle-core/accelerate", "candle-nn/accelerate", "candle-transformers/accelerate"]
mkl = ["candle-core/mkl", "candle-nn/mkl", "candle-transformers/mkl"]

# Zwischenstände und Hilfen für die Golden-Tests (`Silero::debug_stages` und Verwandte).
# Opt-in und nicht Teil der stabilen API; die Tests aktivieren es über die Selbst-Dev-Dependency.
test-util = []

[lints]
workspace = true

[lib]
name = "silero_v5_candle"
path = "src/lib.rs"

[[bin]]
name = "silero"
path = "src/bin/silero.rs"

[dependencies]
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
rayon = "1"
realfft = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
# Aktiviert `test-util` für Tests und Beispiele, ohne die Standard-Features zu ändern.
silero-v5-candle-rs = { path = ".", default-features = false, features = ["test-util"] }
